name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Coverage
        run: npx vitest run --coverage

      - name: Verify CLI binary
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          cli_home="$(mktemp -d)"
          trap 'rm -rf "$cli_home"' EXIT
          export HOME="$cli_home"
          export XDG_CONFIG_HOME="$HOME/.config"

          node ./bin/claude-profile.js --help > "$cli_home/help.txt"
          cat "$cli_home/help.txt"
          grep -Fq 'claude-profile <命令> [选项] [配置名]' "$cli_home/help.txt"
          grep -Fq -- '-h, --help' "$cli_home/help.txt"

          if node ./bin/claude-profile.js __ci_unknown_command__ > "$cli_home/unknown.stdout" 2> "$cli_home/unknown.stderr"; then
            echo '::error::Unknown CLI command unexpectedly succeeded' >&2
            exit 1
          else
            status=$?
          fi
          cat "$cli_home/unknown.stderr" >&2
          test "$status" -eq 1
          grep -Fxq '未知命令: __ci_unknown_command__' "$cli_home/unknown.stderr"
          grep -Fxq '使用 claude-profile --help 查看帮助' "$cli_home/unknown.stderr"
