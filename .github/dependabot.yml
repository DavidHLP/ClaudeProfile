version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - DavidHLP
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore(dev)
      include: scope
    # Preserve the Node 18/20/22 support matrix. Revisit these major lines only
    # in an explicit runtime-support migration; security alerts remain tracked.
    ignore:
      - dependency-name: inquirer
        update-types: [version-update:semver-major]
    groups:
      test-assertions:
        patterns: [expect, jest-mock, "@jest/*"]
        update-types: [minor, patch]
